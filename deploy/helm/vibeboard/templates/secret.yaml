{{- if not .Values.auth.existingSecret }}
{{- $name := printf "%s-secrets" (include "vibeboard.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := .Values.auth.postgresPassword -}}
{{- if and (not $password) $existing -}}
{{- $password = index $existing.data "postgres-password" | b64dec -}}
{{- end -}}
{{- if not $password -}}
{{- $password = randAlphaNum 40 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "vibeboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ $password | quote }}
  {{- with .Values.auth.adminEmail }}
  admin-email: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.adminPassword }}
  admin-password: {{ . | quote }}
  {{- end }}
{{- end }}
