{{- if .Values.clamav.enabled }}
{{- $name := printf "%s-clamav" (include "vibeboard.fullname" .) -}}
{{- $selector := dict "root" . "name" "clamav" -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "vibeboard.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.clamav.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.clamav.size | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "vibeboard.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "vibeboard.selector" $selector | nindent 4 }}
  ports:
    - name: clamd
      port: 3310
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "vibeboard.labels" . | nindent 4 }}
spec:
  replicas: 1
  # The volume can only be attached to one pod at a time
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "vibeboard.selector" $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vibeboard.podLabels" . | nindent 8 }}
        app.kubernetes.io/name: {{ $selector.name | quote }}
    spec:
      automountServiceAccountToken: false
      {{- include "vibeboard.scheduling" . | nindent 6 }}
      containers:
        - name: clamav
          image: {{ include "vibeboard.image" .Values.clamav.image | quote }}
          ports:
            - name: clamd
              containerPort: 3310
          # The first start downloads the signatures
          startupProbe:
            tcpSocket: { port: clamd }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: clamd }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.clamav.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/clamav
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}
{{- end }}
