{{- if .Values.httpRoute.enabled }}
{{- if not .Values.httpRoute.parentRefs }}
{{- fail "httpRoute.parentRefs needs at least one Gateway" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "vibeboard.fullname" . }}
  labels:
    {{- include "vibeboard.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    - timeouts:
        # Long-lived Server-Sent Events connections
        request: "0s"
      backendRefs:
        - name: {{ include "vibeboard.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
