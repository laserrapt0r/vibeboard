{{- if .Values.gotenberg.enabled }}
{{- $name := printf "%s-gotenberg" (include "vibeboard.fullname" .) -}}
{{- $selector := dict "root" . "name" "gotenberg" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "vibeboard.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "vibeboard.selector" $selector | nindent 4 }}
  ports:
    - name: http
      port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "vibeboard.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "vibeboard.selector" $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vibeboard.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ $selector.name | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gotenberg
          image: {{ include "vibeboard.image" .Values.gotenberg.image | quote }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gotenberg.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
{{- end }}
