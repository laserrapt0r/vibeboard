# Alternative to ingress.yaml for clusters using the Gateway API.
# Adapt parentRefs to your Gateway. Set long timeouts on the Gateway implementation as well.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vibeboard
  namespace: vibeboard
spec:
  parentRefs:
    - name: my-gateway
      namespace: gateway-system
  hostnames:
    - board.example.org
  rules:
    - timeouts:
        # Long-lived Server-Sent Events connections
        request: "0s"
      backendRefs:
        - name: vibeboard
          port: 80
