apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vibeboard-backups
  labels:
    app.kubernetes.io/name: vibeboard
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vibeboard
  labels:
    app.kubernetes.io/name: vibeboard
spec:
  selector:
    app.kubernetes.io/name: vibeboard
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibeboard
  labels:
    app.kubernetes.io/name: vibeboard
spec:
  # Do not scale up: live board state, rate limits and login tickets are kept in the memory of one process.
  # Two replicas would each see only part of the people on a board, and their changes would overwrite each other.
  replicas: 1
  # Never run two instances side by side, not even during a rollout
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vibeboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vibeboard
    spec:
      automountServiceAccountToken: false
      # On shutdown the app writes pending changes to the database
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vibeboard
          image: vibeboard
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: vibeboard-config
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: vibeboard-secrets, key: postgres-password }
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef: { name: vibeboard-secrets, key: admin-email, optional: true }
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: vibeboard-secrets, key: admin-password, optional: true }
          # Upgrades run database migrations and a backup before the server starts listening
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: backups
              mountPath: /backups
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: backups
          persistentVolumeClaim:
            claimName: vibeboard-backups
