# Example only – not part of kustomization.yaml, so that no password ends up in Git.
# Prefer creating the Secret directly (see README.md), or use Sealed Secrets / External Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: vibeboard-secrets
  namespace: vibeboard
type: Opaque
stringData:
  postgres-password: "replace-with-a-long-random-password"
  # Optional: creates the first administrator on the first start
  admin-email: "admin@example.org"
  admin-password: "replace-with-a-long-random-password"
