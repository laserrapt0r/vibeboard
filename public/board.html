<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>vibeboard</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#4262ff">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="board-page">
  <a class="skip-link" href="#tools">Zu den Werkzeugen springen</a>
  <!-- Ladeanzeige: steht schon im HTML, damit sie auch bei langsamer Verbindung sofort bereitsteht.
       Sichtbar erst nach kurzer Verzögerung (CSS), damit schnelle Ladevorgänge nicht flackern. -->
  <div id="board-loader" class="page-loader" role="status" aria-live="polite">
    <div class="page-loader-box">
      <span class="spinner" aria-hidden="true"></span>
      <p class="page-loader-text">Board wird geladen …</p>
      <p class="page-loader-hint muted small">Das dauert länger als üblich. Vermutlich hält ein Proxy die Echtzeit-Verbindung zurück – vibeboard wechselt dann automatisch auf ein kompatibles Verfahren.</p>
    </div>
  </div>
  <div id="stage" tabindex="-1" role="application" aria-label="Zeichenfläche des Boards" aria-busy="true">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg">
      <defs id="defs"></defs>
      <g id="world">
        <g id="layer-frames"></g>
        <g id="layer-els"></g>
        <g id="layer-votes"></g>
        <g id="layer-overlay"></g>
        <g id="layer-draft"></g>
      </g>
    </svg>
    <canvas id="laser" aria-hidden="true"></canvas>
    <div id="present-mask" class="hidden"></div>
    <div id="cursors"></div>
    <textarea id="editor" spellcheck="false" autocomplete="off"></textarea>
  </div>

  <header id="topbar" class="panel chrome"></header>
  <div id="topright" class="panel chrome"></div>
  <nav id="tools" class="panel chrome" aria-label="Werkzeuge" tabindex="-1"></nav>
  <div id="ctxbar" class="panel hidden"></div>
  <div id="bottom-left" class="panel chrome"></div>
  <div id="bottom-right" class="chrome">
    <div id="minimap" class="panel" aria-hidden="true"><canvas></canvas></div>
    <div id="zoomctl" class="panel"></div>
  </div>
  <aside id="sidepanel" class="panel chrome hidden"></aside>
  <div id="timer-widget" class="panel hidden"></div>
  <div id="voting-banner" class="panel chrome hidden"></div>
  <div id="follow-banner" class="hidden"></div>
  <div id="search-box" class="panel hidden"></div>
  <div id="present-bar" class="panel hidden"></div>

  <script src="/js/table-ops.js"></script>
  <script src="/js/conceal-ops.js"></script>
  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/pwa.js"></script>
</body>
</html>
