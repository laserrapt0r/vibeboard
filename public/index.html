<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vibeboard – Boards</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#4262ff">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="dash-page">
  <a class="skip-link" href="#dash-main">Zum Inhalt springen</a>
  <header class="dash-top">
    <a class="dash-brand" href="/">
      <svg viewBox="0 0 32 32" width="32" height="32"><rect x="2" y="2" width="28" height="28" rx="7" fill="#4262ff"/><rect x="8" y="8" width="9" height="9" rx="1.5" fill="#fff9b1"/><rect x="15" y="15" width="9" height="9" rx="1.5" fill="#ffcee0"/></svg>
      <span>vibeboard</span>
    </a>
    <div class="spacer"></div>
    <input id="dash-search" type="search" placeholder="Boards durchsuchen …" aria-label="Boards durchsuchen">
    <span id="dash-bell"></span>
    <a id="dash-admin" class="icon-btn hidden" href="/admin" title="Administration"></a>
    <button id="dash-dark" class="icon-btn" title="Dunkles Design"></button>
    <button id="dash-user" class="avatar" title="Konto"></button>
  </header>
  <main id="dash-main" class="dash-main dash-layout" tabindex="-1">
    <h1 class="sr-only">Boards</h1>
    <nav id="dash-nav" class="dash-nav" aria-label="Boards ordnen"></nav>
    <div class="dash-page-content">
      <!-- Start: Vorlagenleiste, fällige Aufgaben, zuletzt bearbeitete Boards -->
      <div id="dash-skeleton" class="dash-boards" role="status" aria-live="polite" aria-label="Boards werden geladen"><span class="sr-only">Boards werden geladen …</span><div class="board-card skeleton-card"><div class="board-thumb"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div><div class="board-card skeleton-card"><div class="board-thumb"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div><div class="board-card skeleton-card"><div class="board-thumb"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div><div class="board-card skeleton-card"><div class="board-thumb"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div><div class="board-card skeleton-card"><div class="board-thumb"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div><div class="board-card skeleton-card"><div class="board-thumb"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
      <div id="dash-invites" class="dash-invites" aria-live="polite"></div>
      <div id="dash-account-hint"></div>
      <section id="dash-start" class="dash-view hidden">
        <div class="dash-section-head">
          <h2>Neues Board aus Vorlage</h2>
          <div class="spacer"></div>
          <button id="dash-tpl-toggle" class="btn small"></button>
          <button id="dash-all-templates" class="btn small">Alle Vorlagen</button>
        </div>
        <div id="dash-templates" class="dash-templates strip"></div>
        <div id="dash-due"></div>
        <div class="dash-section-head">
          <h2>Zuletzt bearbeitet</h2>
          <div class="spacer"></div>
          <button id="dash-show-all" class="btn small">Alle Boards anzeigen</button>
        </div>
        <div id="dash-recent" class="dash-boards"></div>
      </section>
      <!-- Meine Aufgaben -->
      <section id="dash-trash-view" class="dash-view hidden">
        <div class="dash-section-head">
          <h2>Papierkorb</h2>
        </div>
        <p id="dash-trash-info" class="muted"></p>
        <div id="dash-trash" class="dash-boards"></div>
      </section>
      <section id="dash-tasks-view" class="dash-view hidden">
        <div class="dash-section-head">
          <h2>Meine Aufgaben</h2>
          <span id="dash-tasks-count" class="muted"></span>
          <div class="spacer"></div>
          <div id="dash-tasks-filter" class="seg"></div>
        </div>
        <div id="dash-tasks" class="my-task-list"></div>
      </section>
      <!-- Board-Listen: alle, eigene, geteilte, Ordner, Teams -->
      <section id="dash-boards-view" class="dash-view hidden">
        <div class="dash-section-head">
          <h2 id="dash-title">Alle Boards</h2>
          <div id="dash-view-actions" class="row"></div>
          <div class="spacer"></div>
          <select id="dash-sort" class="btn small">
            <option value="updated">Zuletzt bearbeitet</option>
            <option value="created">Zuletzt erstellt</option>
            <option value="name">Name</option>
          </select>
          <button id="dash-import" class="btn small">JSON importieren</button>
        </div>
        <div id="dash-folderbar" class="dash-folderbar hidden"></div>
        <div id="dash-boards" class="dash-boards"></div>
      </section>
    </div>
  </main>
  <footer class="site-footer" id="footer"></footer>
  <script src="/js/table-formula.js"></script>
  <script type="module" src="/js/dashboard.js"></script>
  <script type="module" src="/js/pwa.js"></script>
</body>
</html>
