# vibeboard mit PostgreSQL
#   docker compose up -d --build        → http://localhost:3000
# Enthalten: PostgreSQL, ClamAV (Virenscan, Signaturen aktualisieren sich automatisch), vibeboard
# Optional mit Test-Mailserver (Weboberfläche http://localhost:8025, SMTP: mailpit:1025):
#   docker compose --profile mailtest up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vibeboard}
      POSTGRES_USER: ${POSTGRES_USER:-vibeboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Bitte POSTGRES_PASSWORD in der .env setzen}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  app:
    build: .
    image: vibeboard:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-vibeboard}
      PGUSER: ${POSTGRES_USER:-vibeboard}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Optional: Administrator beim ersten Start anlegen
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Öffentliche Adresse für Links in E-Mails (alternativ in der Administration einstellbar)
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Hinter einem Reverse-Proxy auf 1 setzen (echte Client-IP für Rate-Limits und Protokoll)
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Virenscan hochgeladener Dateien über den ClamAV-Dienst
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: 3310
      # Vor jedem Datenbank-Upgrade wird eine Sicherung nach /backups geschrieben (die letzten 10 bleiben erhalten)
      BACKUP_KEEP: ${BACKUP_KEEP:-10}
      # Protokollierung (siehe .env.example); ansehen mit: docker compose logs -f app
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    ports:
      - "${PORT:-3000}:3000"
    # Boards der dateibasierten Version 1 (./data/boards) werden beim ersten Start einmalig übernommen
    volumes:
      - ./data:/import:ro
      - backups:/backups
    # Härtung: schreibgeschütztes Dateisystem, keine zusätzlichen Rechte
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Virenscanner; aktualisiert seine Signaturen selbstständig (freshclam, mehrmals täglich).
  # Benötigt etwa 1,5 GB Arbeitsspeicher; der erste Start dauert einige Minuten (Download der Signaturen).
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav:/var/lib/clamav
    security_opt:
      - no-new-privileges:true

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mailtest"]
    restart: unless-stopped
    ports:
      - "8025:8025"

volumes:
  pgdata:
  backups:
  clamav:
